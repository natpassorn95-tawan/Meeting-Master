<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>會議大師 Meeting Master</title>
    <style>
      :root {
        --color-background-primary: #fff;
        --color-background-secondary: #f6f6f7;
        --color-border-secondary: rgba(0, 0, 0, 0.3);
        --color-border-tertiary: rgba(0, 0, 0, 0.12);
        --color-text-primary: #111;
        --color-text-secondary: #666;
        --color-text-tertiary: #999;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--color-background-secondary);
        color: var(--color-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { padding: 1.5rem 1rem; min-height: 100vh; }

      /* ── Smooth interactions ─────────────────────────────────────────
         touch-action: manipulation removes the tap delay some in-app
         browsers (LINE) add while they wait to see if it's a double-tap. */
      button, a, [role="button"], input[type="checkbox"], input[type="radio"], label {
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        transition: transform .08s ease, filter .15s ease, opacity .15s ease,
          background-color .15s ease, box-shadow .15s ease;
        user-select: none;
        -webkit-user-select: none;
      }
      button:not(:disabled):hover { filter: brightness(0.96); }
      button:not(:disabled):active { transform: scale(0.97); filter: brightness(0.9); }
      button:disabled { cursor: default !important; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid #534AB7; outline-offset: 2px;
      }

      /* Toasts (replace alert) */
      .mm-toasts {
        position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
        transform: translateX(-50%); z-index: 3000;
        display: flex; flex-direction: column; gap: 8px; align-items: center;
        width: min(92vw, 440px); pointer-events: none;
      }
      .mm-toast {
        pointer-events: auto; cursor: pointer; width: 100%;
        display: flex; gap: 10px; align-items: flex-start;
        padding: 12px 14px; font-size: 14px; line-height: 1.5;
        background: var(--color-background-primary); color: var(--color-text-primary);
        border-radius: 10px; border-left: 4px solid #0F6E56;
        box-shadow: 0 6px 24px rgba(0, 0, 0, .16);
        animation: mm-toast-in .22s cubic-bezier(.2, .9, .3, 1.2);
      }
      @keyframes mm-toast-in { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

      /* Dialog (replaces confirm / prompt) */
      .mm-dialog-backdrop {
        position: fixed; inset: 0; z-index: 2500; background: rgba(0, 0, 0, .42);
        display: flex; align-items: center; justify-content: center; padding: 16px;
        animation: mm-fade .15s ease;
      }
      .mm-dialog {
        width: min(100%, 420px); max-height: 85vh; overflow-y: auto;
        background: var(--color-background-primary); border-radius: 14px; padding: 20px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, .25);
        animation: mm-pop .18s cubic-bezier(.2, .9, .3, 1.2);
      }
      @keyframes mm-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes mm-pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

      /* Small inline spinner for buttons that are waiting on the server */
      .mm-spin {
        display: inline-block; width: 14px; height: 14px; vertical-align: -2px; margin-right: 6px;
        border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
        animation: mm-rot .7s linear infinite;
      }
      @keyframes mm-rot { to { transform: rotate(360deg); } }
      /* Any button marked aria-busy gets the spinner automatically */
      button[aria-busy="true"]::before {
        content: ""; display: inline-block; width: 13px; height: 13px; margin-right: 7px; vertical-align: -2px;
        border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%;
        animation: mm-rot .7s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
