# Meeting Master CI
#
# Replaces the wizard-generated Auto-DevOps config, which could not pass on this
# GitLab: Auto DevOps builds a container image and deploys to Kubernetes, but
# every runner registered on 192.168.1.206 is a Windows PowerShell *shell*
# executor. There is deliberately no `image:` key here for the same reason -
# a shell executor runs jobs directly on the host.
#
# The `tags` below matter: runner #6 (meeting-master-host) only accepts jobs
# that ask for its tag. The old config asked for no tag, so no runner ever
# matched and every pipeline failed instantly at 00:00:00.

stages:
  - test

verify:
  stage: test
  tags:
    - meeting-master-host
  script:
    # esbuild's postinstall is gated by npm's allowScripts, and without it
    # `vite build` fails on a missing binary. package.json now carries the
    # approval; re-approving here is a no-op that keeps the job working if that
    # entry is ever dropped.
    - npm ci
    - npm approve-scripts esbuild
    - npm test
    - npm run build
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 1 week
